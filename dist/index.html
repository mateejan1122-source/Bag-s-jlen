<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bag Søjlen - Gastronomi i Rønde</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --color-cream: #faf9f6;
      --color-gold: #CDA235;
      --color-gold-hover: #b48f4a;
      --color-black: #000000;
      --color-dark-grey: #1a1a1a;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-cream);
      color: var(--color-dark-grey);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
      font-weight: 300;
    }

    h1,
    h2,
    h3,
    h4,
    .serif {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
    }

    .img-cover {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    input,
    textarea,
    button {
      border-radius: 0 !important;
    }

    .btn-gold {
      background-color: var(--color-gold);
      color: white;
      transition: all 0.3s ease;
    }

    .btn-gold:hover {
      background-color: var(--color-gold-hover);
      transform: translateY(-2px);
    }

    .btn-outline-gold {
      border: 1px solid var(--color-gold);
      color: var(--color-gold);
      transition: all 0.3s ease;
    }

    .btn-outline-gold:hover {
      background-color: var(--color-gold);
      color: white;
    }

    @media print {
      .no-print {
        display: none;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #faf9f6;
    }

    ::-webkit-scrollbar-thumb {
      background: #e2e1dd;
      border: 3px solid #faf9f6;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #CDA235;
    }

    ::selection {
      background: #CDA235;
      color: white;
    }

    /* Dynamic Content Formatting for WYSIWYG and frontend pages */
    .dynamic-content h1,
    .dynamic-content h2,
    .dynamic-content h3,
    .dynamic-content h4 {
      font-family: 'Playfair Display', serif !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      color: #CDA235 !important;
      margin-top: 2rem !important;
      margin-bottom: 1rem !important;
      font-size: 1.15rem !important;
    }

    .dynamic-content p,
    .dynamic-content div,
    .dynamic-content span {
      margin-bottom: 1.25rem;
      font-family: 'Inter', sans-serif !important;
      font-weight: 300 !important;
      color: #4b5563 !important;
      line-height: 1.625 !important;
      font-size: 0.95rem !important;
    }

    .dynamic-content ul {
      list-style-type: disc !important;
      list-style-position: outside !important;
      margin-left: 1.125rem !important;
      margin-bottom: 1.25rem !important;
      color: #4b5563 !important;
    }

    .dynamic-content li {
      margin-bottom: 0.5rem !important;
      font-family: 'Inter', sans-serif !important;
      font-weight: 300 !important;
      color: #4b5563 !important;
      line-height: 1.625 !important;
      font-size: 0.95rem !important;
    }

    .dynamic-content b,
    .dynamic-content strong {
      font-weight: 600 !important;
      color: #4b5563 !important;
    }

    .dynamic-content em,
    .dynamic-content i {
      font-style: italic !important;
    }

    /* Make sure the editor itself doesn't override */
    .rsw-editor {
      color: #4b5563 !important;
      font-family: 'Inter', sans-serif !important;
    }
  </style>
