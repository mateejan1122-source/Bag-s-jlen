<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bag Søjlen - Gastronomi i Rønde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-cream: #faf9f6;
        --color-gold: #c5a059;
        --color-gold-hover: #b48f4a;
        --color-black: #000000;
        --color-dark-grey: #1a1a1a;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-cream);
        color: var(--color-dark-grey);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
      }
      h1, h2, h3, .serif {
        font-family: 'Playfair Display', serif;
      }
      
      .img-cover {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      input, textarea, button {
        border-radius: 0 !important;
      }
      
      .btn-gold {
        background-color: var(--color-gold);
        color: white;
        transition: all 0.3s ease;
      }
      .btn-gold:hover {
        background-color: var(--color-gold-hover);
        transform: translateY(-2px);
      }

      .btn-outline-gold {
        border: 1px solid var(--color-gold);
        color: var(--color-gold);
        transition: all 0.3s ease;
      }
      .btn-outline-gold:hover {
        background-color: var(--color-gold);
        color: white;
      }

      @media print {
        .no-print { display: none; }
      }
    </style>
